<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ideas Priority Interface</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f8f5;
      --surface: #ffffff;
      --surface-soft: #f0f4f2;
      --ink: #18211f;
      --muted: #65706c;
      --line: #dbe2dd;
      --line-strong: #aebbb4;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --blue: #2563eb;
      --amber: #a16207;
      --green: #15803d;
      --rose: #be123c;
      --shadow: 0 18px 45px rgba(28, 38, 35, 0.12);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0)),
        var(--page);
      color: var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .source-note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(28, 38, 35, 0.04);
    }

    .control-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-soft);
    }

    .control-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .control-button.primary:hover {
      background: #115e59;
    }

    .icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    .status {
      min-height: 20px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-shell {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.handle-col {
      width: 54px;
    }

    col.priority-col {
      width: 84px;
    }

    col.idea-col {
      width: auto;
    }

    col.impact-col,
    col.effort-col,
    col.started-col {
      width: 140px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 46px;
      background: #eef3f0;
      color: #32403b;
      border-bottom: 1px solid var(--line);
      font-size: 0.76rem;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th.center,
    td.center {
      text-align: center;
    }

    tbody tr {
      background: var(--surface);
      transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #fbfcfa;
    }

    tbody tr.dragging {
      opacity: 0.45;
      background: #e7f4f1;
    }

    tbody tr.drop-target {
      box-shadow: inset 0 2px 0 var(--accent);
    }

    .drag-cell {
      padding: 6px 8px;
    }

    .drag-handle {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      cursor: grab;
      color: #6b7672;
      touch-action: none;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-handle:hover,
    .drag-handle:focus-visible {
      border-color: var(--line);
      background: var(--surface-soft);
      outline: none;
    }

    .drag-handle::before {
      content: "";
      width: 16px;
      height: 22px;
      background-image: radial-gradient(currentColor 1.45px, transparent 1.45px);
      background-size: 8px 8px;
      background-position: 0 1px;
    }

    .priority {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 28px;
      border-radius: 999px;
      background: #e7f4f1;
      color: #0f5f58;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .idea {
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .select-shell {
      position: relative;
      display: inline-flex;
      min-width: 104px;
    }

    .select-shell::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 10px;
      width: 7px;
      height: 7px;
      border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      pointer-events: none;
      transform: translateY(-65%) rotate(45deg);
      opacity: 0.66;
    }

    .value-select {
      width: 100%;
      min-height: 30px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 4px 28px 4px 12px;
      appearance: none;
      background: var(--surface-soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .value-select:hover,
    .value-select:focus-visible {
      border-color: var(--line-strong);
      outline: none;
    }

    .value-select.high {
      background: #fee2e2;
      color: var(--rose);
    }

    .value-select.medium {
      background: #dbeafe;
      color: var(--blue);
    }

    .value-select.low,
    .value-select.very-low {
      background: #ecfccb;
      color: var(--green);
    }

    .value-select.testing {
      background: #fef3c7;
      color: var(--amber);
    }

    .value-select.yes {
      background: #dcfce7;
      color: var(--green);
    }

    .value-select.no {
      background: #f3f4f6;
      color: #4b5563;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      border: 1px solid rgba(15, 118, 110, 0.24);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100vw - 20px, 1280px);
        padding-top: 18px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        justify-content: flex-start;
      }

      .control-button {
        min-height: 40px;
      }

      table {
        min-width: 760px;
      }

      th,
      td {
        padding: 10px 12px;
      }

      col.priority-col {
        width: 76px;
      }

      col.impact-col,
      col.effort-col,
      col.started-col {
        width: 116px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>AI Ideas</h1>
        <p class="source-note">Rows extracted from AI Ideas.pdf</p>
      </div>
      <div class="controls" aria-label="Table controls">
        <button class="control-button" id="resetOrder" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 3v6h6"></path>
          </svg>
          Reset
        </button>
        <button class="control-button" id="copyCsv" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy CSV
        </button>
        <button class="control-button primary" id="downloadCsv" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <path d="M7 10l5 5 5-5"></path>
            <path d="M12 15V3"></path>
          </svg>
          Export CSV
        </button>
      </div>
    </header>

    <p class="status" id="status" aria-live="polite"></p>

    <section class="table-shell" aria-label="AI ideas priority table">
      <table>
        <colgroup>
          <col class="handle-col">
          <col class="priority-col">
          <col class="idea-col">
          <col class="impact-col">
          <col class="effort-col">
          <col class="started-col">
        </colgroup>
        <thead>
          <tr>
            <th class="center" scope="col"></th>
            <th class="center" scope="col">Priority</th>
            <th scope="col">IDEA + Description</th>
            <th scope="col">Impact</th>
            <th scope="col">Effort</th>
            <th scope="col">Started</th>
          </tr>
        </thead>
        <tbody id="ideasBody"></tbody>
      </table>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STATE_API = "/api/state";
    const STORAGE_KEY = "aiIdeasPriorityOrder:v1";
    const EDITS_KEY = "aiIdeasCellEdits:v1";
    const SYNC_INTERVAL_MS = 15000;
    const fieldOptions = {
      impact: ["", "Testing", "Low", "Medium", "High"],
      effort: ["", "Very low", "Low", "Medium", "High"],
      started: ["", "Yes", "No"]
    };
    const ideas = [
      { id: "geo-scorecard", idea: "Zoe’s GEO Scorecard Generator", impact: "Testing", effort: "Very low", started: "Yes" },
      { id: "timeline-release", idea: "Timeline / Release Optimizer", impact: "High", effort: "High", started: "" },
      { id: "weekly-playlist", idea: "Weekly Playlist Tracker for new releases", impact: "High", effort: "Medium", started: "Yes" },
      { id: "cisco-breakpoint", idea: "Cisco’s Breakpoint", impact: "", effort: "", started: "Yes" },
      { id: "cisco-catalogue", idea: "Cisco’s Catalogue Sleeper Hits", impact: "", effort: "", started: "Yes" },
      { id: "billboard-rules", idea: "Billboard Rules chatbot", impact: "", effort: "", started: "" },
      { id: "google-cosign", idea: "Google CoSign", impact: "", effort: "", started: "Yes" },
      { id: "roi-measurement", idea: "Zoe’s ROI Measurement (comparing actual revenues to the forecasted revenue based on machine learning)", impact: "", effort: "High", started: "" },
      { id: "new-release-scorecard", idea: "Zoe’s New Release Scorecard (similarities to Breakpoint)", impact: "", effort: "Medium", started: "Yes" },
      { id: "catalog-track-glenn", idea: "Zoe’s Catalog Track Identifier for Glenn (long term growth)", impact: "", effort: "Low", started: "Yes" },
      { id: "icla-track", idea: "Zoe’s ICLA Track Identifier", impact: "", effort: "Low", started: "Yes" },
      { id: "advertising-intel", idea: "Advertising Intelligence Agent", impact: "", effort: "Medium", started: "" },
      { id: "marketing-intel", idea: "Marketing Intelligence Agent", impact: "", effort: "High", started: "" },
      { id: "marketing-brainstorm", idea: "Marketing Brainstorm Agent", impact: "Low", effort: "Low", started: "" },
      { id: "unsigned-artists", idea: "Unsigned artists score", impact: "", effort: "Medium", started: "" },
      { id: "content-generator", idea: "Content Generator", impact: "", effort: "Low", started: "" },
      { id: "ar-delivery-admin", idea: "A&R music delivery admin", impact: "", effort: "Medium", started: "" },
      { id: "eta-travel", idea: "eTA Artist Travel Agent", impact: "", effort: "High", started: "" },
      { id: "republic-rolodex", idea: "Republic Records A&R creative rolodex", impact: "Low", effort: "Low", started: "" },
      { id: "influencer-matching", idea: "Influencer to Music Matching Score", impact: "", effort: "Medium", started: "" },
      { id: "sync-support", idea: "Sync support agent", impact: "", effort: "Medium", started: "" },
      { id: "international-pulsemap", idea: "International PulseMap", impact: "", effort: "Medium", started: "" }
    ];

    const tbody = document.querySelector("#ideasBody");
    const status = document.querySelector("#status");
    const toast = document.querySelector("#toast");
    let dragRow = null;
    let activePointerId = null;
    let toastTimer = null;
    let remoteSaveTimer = null;
    let syncLabel = "Loading shared database...";
    let lastRemoteUpdatedAt = null;
    let isSavingRemote = false;
    let edits = loadEdits();

    function loadOrder() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const validSaved = saved.filter((id) => ideas.some((idea) => idea.id === id));
        const missing = ideas.map((idea) => idea.id).filter((id) => !validSaved.includes(id));
        return [...validSaved, ...missing];
      } catch {
        return ideas.map((idea) => idea.id);
      }
    }

    function getOrderedIdeas() {
      const byId = new Map(ideas.map((idea) => [idea.id, idea]));
      return loadOrder().map((id) => byId.get(id)).filter(Boolean);
    }

    function updateStatus() {
      const count = tbody.querySelectorAll("tr").length || ideas.length;
      status.textContent = `${count} ideas ordered by priority${syncLabel ? ` • ${syncLabel}` : ""}`;
    }

    function loadEdits() {
      try {
        const saved = JSON.parse(localStorage.getItem(EDITS_KEY) || "{}");
        return saved && typeof saved === "object" ? saved : {};
      } catch {
        return {};
      }
    }

    function saveEdits() {
      localStorage.setItem(EDITS_KEY, JSON.stringify(edits));
    }

    function getCellValue(item, field) {
      return edits[item.id]?.[field] ?? item[field] ?? "";
    }

    function setCellValue(id, field, value) {
      if (!edits[id]) edits[id] = {};
      edits[id][field] = value;
      saveEdits();
    }

    function saveCurrentOrder() {
      const ids = [...tbody.querySelectorAll("tr")].map((row) => row.dataset.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
      updatePriorities();
      updateStatus();
      queueRemoteSave();
    }

    function slug(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "-");
    }

    function applySelectTone(select) {
      select.className = `value-select ${slug(select.value) || "empty"}`;
    }

    function editableSelectCell(item, field) {
      const td = document.createElement("td");
      const shell = document.createElement("span");
      shell.className = "select-shell";
      const select = document.createElement("select");
      select.dataset.id = item.id;
      select.dataset.field = field;
      select.setAttribute("aria-label", `${field} for ${item.idea}`);

      fieldOptions[field].forEach((optionValue) => {
        const option = document.createElement("option");
        option.value = optionValue;
        option.textContent = optionValue || "None";
        select.append(option);
      });

      select.value = getCellValue(item, field);
      applySelectTone(select);
      shell.append(select);
      td.append(shell);
      return td;
    }

    function renderRows() {
      tbody.replaceChildren();
      getOrderedIdeas().forEach((item) => {
        const row = document.createElement("tr");
        row.dataset.id = item.id;

        const dragCell = document.createElement("td");
        dragCell.className = "drag-cell center";
        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "drag-handle";
        handle.setAttribute("aria-label", `Move ${item.idea}`);
        handle.title = "Drag to reorder";
        dragCell.append(handle);

        const priorityCell = document.createElement("td");
        priorityCell.className = "center";
        const priority = document.createElement("span");
        priority.className = "priority";
        priorityCell.append(priority);

        const ideaCell = document.createElement("td");
        const ideaText = document.createElement("div");
        ideaText.className = "idea";
        ideaText.textContent = item.idea;
        ideaCell.append(ideaText);

        row.append(
          dragCell,
          priorityCell,
          ideaCell,
          editableSelectCell(item, "impact"),
          editableSelectCell(item, "effort"),
          editableSelectCell(item, "started")
        );
        tbody.append(row);
      });
      updatePriorities();
      updateStatus();
    }

    function updatePriorities() {
      [...tbody.querySelectorAll("tr")].forEach((row, index) => {
        row.querySelector(".priority").textContent = index + 1;
      });
    }

    function getDragAfterElement(y) {
      const rows = [...tbody.querySelectorAll("tr:not(.dragging)")];
      return rows.reduce((closest, row) => {
        const box = row.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: row };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    function moveDragRow(clientY) {
      if (!dragRow) return;
      const afterElement = getDragAfterElement(clientY);
      tbody.querySelectorAll(".drop-target").forEach((row) => row.classList.remove("drop-target"));
      if (afterElement) {
        afterElement.classList.add("drop-target");
        tbody.insertBefore(dragRow, afterElement);
      } else {
        tbody.append(dragRow);
      }
      updatePriorities();
    }

    function finishDrag() {
      if (!dragRow) return;
      dragRow.classList.remove("dragging");
      tbody.querySelectorAll(".drop-target").forEach((row) => row.classList.remove("drop-target"));
      dragRow = null;
      activePointerId = null;
      saveCurrentOrder();
      showToast("Priority order saved");
    }

    tbody.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest(".drag-handle");
      if (!handle) return;
      dragRow = handle.closest("tr");
      activePointerId = event.pointerId;
      dragRow.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    tbody.addEventListener("pointermove", (event) => {
      if (!dragRow || event.pointerId !== activePointerId) return;
      event.preventDefault();
      moveDragRow(event.clientY);
    });

    tbody.addEventListener("pointerup", (event) => {
      if (event.pointerId !== activePointerId) return;
      finishDrag();
    });

    tbody.addEventListener("pointercancel", (event) => {
      if (event.pointerId !== activePointerId) return;
      finishDrag();
    });

    tbody.addEventListener("dragstart", (event) => {
      const row = event.target.closest("tr");
      if (!row) return;
      dragRow = row;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", row.dataset.id);
    });

    tbody.addEventListener("dragover", (event) => {
      event.preventDefault();
      if (!dragRow) return;
      moveDragRow(event.clientY);
    });

    tbody.addEventListener("dragend", () => {
      finishDrag();
    });

    tbody.addEventListener("keydown", (event) => {
      if (!event.target.matches(".drag-handle")) return;
      const row = event.target.closest("tr");
      if (event.key === "ArrowUp" && row.previousElementSibling) {
        event.preventDefault();
        tbody.insertBefore(row, row.previousElementSibling);
        saveCurrentOrder();
      }
      if (event.key === "ArrowDown" && row.nextElementSibling) {
        event.preventDefault();
        tbody.insertBefore(row.nextElementSibling, row);
        saveCurrentOrder();
      }
    });

    tbody.addEventListener("change", (event) => {
      if (!event.target.matches(".value-select")) return;
      const { id, field } = event.target.dataset;
      setCellValue(id, field, event.target.value);
      applySelectTone(event.target);
      showToast("Selection saved");
      queueRemoteSave();
    });

    function currentRows() {
      const byId = new Map(ideas.map((idea) => [idea.id, idea]));
      return [...tbody.querySelectorAll("tr")].map((row, index) => {
        const item = byId.get(row.dataset.id);
        return {
          priority: index + 1,
          ...item,
          impact: getCellValue(item, "impact"),
          effort: getCellValue(item, "effort"),
          started: getCellValue(item, "started")
        };
      });
    }

    function csvEscape(value) {
      return `"${String(value ?? "").replaceAll('"', '""')}"`;
    }

    function makeCsv() {
      const headers = ["Priority", "IDEA + Description", "Impact", "Effort", "Started"];
      const lines = [headers.map(csvEscape).join(",")];
      currentRows().forEach((row) => {
        lines.push([row.priority, row.idea, row.impact, row.effort, row.started].map(csvEscape).join(","));
      });
      return lines.join("\n");
    }

    async function copyCsv() {
      const csv = makeCsv();
      try {
        await navigator.clipboard.writeText(csv);
        showToast("CSV copied");
      } catch {
        showToast("CSV copy was blocked by the browser");
      }
    }

    function downloadCsv() {
      const blob = new Blob([makeCsv()], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "ai-ideas-priority.csv";
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      showToast("CSV exported");
    }

    function resetOrder() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(EDITS_KEY);
      edits = {};
      renderRows();
      queueRemoteSave();
      showToast("Priority order and selections reset");
    }

    function isAllowedValue(field, value) {
      return fieldOptions[field].includes(value) ? value : "";
    }

    function applyRemoteState(state) {
      if (!Array.isArray(state.rows)) return;
      const validIds = new Set(ideas.map((idea) => idea.id));
      const remoteIds = state.rows.map((row) => row.id).filter((id) => validIds.has(id));
      const missingIds = ideas.map((idea) => idea.id).filter((id) => !remoteIds.includes(id));
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...remoteIds, ...missingIds]));

      edits = {};
      state.rows.forEach((row) => {
        if (!validIds.has(row.id)) return;
        edits[row.id] = {
          impact: isAllowedValue("impact", row.impact || ""),
          effort: isAllowedValue("effort", row.effort || ""),
          started: isAllowedValue("started", row.started || "")
        };
      });
      saveEdits();
      renderRows();
    }

    async function loadRemoteState({ silent = false } = {}) {
      if (!silent) {
        syncLabel = "Loading shared database...";
        updateStatus();
      }

      try {
        const response = await fetch(STATE_API, { cache: "no-store" });
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || "Shared database unavailable");

        const hasNewRemoteState = state.updatedAt && state.updatedAt !== lastRemoteUpdatedAt;
        if (hasNewRemoteState && !isSavingRemote) {
          applyRemoteState(state);
          if (silent && lastRemoteUpdatedAt) showToast("Shared updates loaded");
        }

        lastRemoteUpdatedAt = state.updatedAt || lastRemoteUpdatedAt;
        syncLabel = state.storage === "local-dev" ? "Local dev database" : "Shared database connected";
        updateStatus();
      } catch (error) {
        syncLabel = "Shared database offline; using this browser";
        updateStatus();
        if (!silent) showToast(error.message || "Shared database unavailable");
      }
    }

    function queueRemoteSave() {
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer = setTimeout(saveRemoteState, 350);
    }

    async function saveRemoteState() {
      isSavingRemote = true;
      syncLabel = "Saving shared database...";
      updateStatus();

      try {
        const response = await fetch(STATE_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rows: currentRows() })
        });
        const state = await response.json();
        if (!response.ok) throw new Error(state.error || "Shared save failed");

        lastRemoteUpdatedAt = state.updatedAt || lastRemoteUpdatedAt;
        syncLabel = state.storage === "local-dev" ? "Saved to local dev database" : "Saved to shared database";
        updateStatus();
      } catch (error) {
        syncLabel = "Shared save failed; local browser copy kept";
        updateStatus();
        showToast(error.message || "Shared save failed");
      } finally {
        isSavingRemote = false;
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    document.querySelector("#copyCsv").addEventListener("click", copyCsv);
    document.querySelector("#downloadCsv").addEventListener("click", downloadCsv);
    document.querySelector("#resetOrder").addEventListener("click", resetOrder);

    renderRows();
    loadRemoteState();
    setInterval(() => loadRemoteState({ silent: true }), SYNC_INTERVAL_MS);
  </script>
</body>
</html>
