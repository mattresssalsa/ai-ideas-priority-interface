<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ideas Priority Interface</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f8f5;
      --surface: #ffffff;
      --surface-soft: #f0f4f2;
      --ink: #18211f;
      --muted: #65706c;
      --line: #dbe2dd;
      --line-strong: #aebbb4;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --blue: #2563eb;
      --amber: #a16207;
      --green: #15803d;
      --rose: #be123c;
      --shadow: 0 18px 45px rgba(28, 38, 35, 0.12);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0)),
        var(--page);
      color: var(--ink);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .source-note {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 0 12px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(28, 38, 35, 0.04);
    }

    .control-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-soft);
    }

    .control-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .control-button.primary:hover {
      background: #115e59;
    }

    .icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    .status {
      min-height: 20px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .table-shell {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 1040px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    col.handle-col {
      width: 54px;
    }

    col.priority-col {
      width: 84px;
    }

    col.idea-col {
      width: auto;
    }

    col.impact-col,
    col.effort-col,
    col.started-col {
      width: 140px;
    }

    col.actions-col {
      width: 126px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 46px;
      background: #eef3f0;
      color: #32403b;
      border-bottom: 1px solid var(--line);
      font-size: 0.76rem;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    th.center,
    td.center {
      text-align: center;
    }

    tbody tr {
      background: var(--surface);
      transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #fbfcfa;
    }

    tbody tr.dragging {
      opacity: 0.45;
      background: #e7f4f1;
    }

    tbody tr.drop-target {
      box-shadow: inset 0 2px 0 var(--accent);
    }

    tbody tr.archived-row {
      background: #f8faf9;
      color: #6b7672;
    }

    .drag-cell {
      padding: 6px 8px;
    }

    .drag-handle {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      cursor: grab;
      color: #6b7672;
      touch-action: none;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drag-handle:hover,
    .drag-handle:focus-visible {
      border-color: var(--line);
      background: var(--surface-soft);
      outline: none;
    }

    .drag-handle::before {
      content: "";
      width: 16px;
      height: 22px;
      background-image: radial-gradient(currentColor 1.45px, transparent 1.45px);
      background-size: 8px 8px;
      background-position: 0 1px;
    }

    .priority {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 28px;
      border-radius: 999px;
      background: #e7f4f1;
      color: #0f5f58;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .idea {
      font-weight: 650;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .idea-input {
      display: block;
      width: 100%;
      min-height: 38px;
      max-height: 130px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink);
      font-weight: 650;
      line-height: 1.35;
      resize: vertical;
      padding: 7px 9px;
      overflow-wrap: anywhere;
    }

    .idea-input:hover,
    .idea-input:focus-visible {
      border-color: var(--line);
      background: #fbfcfa;
      outline: none;
    }

    .archived-row .idea-input {
      color: #6b7672;
      text-decoration: line-through;
    }

    .select-shell {
      position: relative;
      display: inline-flex;
      min-width: 104px;
    }

    .select-shell::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 10px;
      width: 7px;
      height: 7px;
      border-right: 1.7px solid currentColor;
      border-bottom: 1.7px solid currentColor;
      pointer-events: none;
      transform: translateY(-65%) rotate(45deg);
      opacity: 0.66;
    }

    .value-select {
      width: 100%;
      min-height: 30px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 4px 28px 4px 12px;
      appearance: none;
      background: var(--surface-soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    .value-select:hover,
    .value-select:focus-visible {
      border-color: var(--line-strong);
      outline: none;
    }

    .value-select.high {
      background: #fee2e2;
      color: var(--rose);
    }

    .value-select.medium {
      background: #dbeafe;
      color: var(--blue);
    }

    .value-select.low,
    .value-select.very-low {
      background: #ecfccb;
      color: var(--green);
    }

    .value-select.testing {
      background: #fef3c7;
      color: var(--amber);
    }

    .value-select.yes {
      background: #dcfce7;
      color: var(--green);
    }

    .value-select.no {
      background: #f3f4f6;
      color: #4b5563;
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: #5f6c67;
      cursor: pointer;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--line-strong);
      background: var(--surface-soft);
      outline: none;
    }

    .icon-button.archive:hover,
    .icon-button.archive:focus-visible {
      color: var(--rose);
    }

    .icon-button.restore:hover,
    .icon-button.restore:focus-visible {
      color: var(--accent);
    }

    .archived-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      min-height: 28px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .empty-state {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      width: min(560px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(24, 33, 31, 0.32);
    }

    .dialog-form {
      padding: 20px;
    }

    .dialog-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .dialog-title {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.2;
    }

    .field-stack {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field-stack label {
      color: #34413d;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .dialog-textarea,
    .dialog-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      padding: 10px 11px;
    }

    .dialog-textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.4;
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: min(360px, calc(100vw - 36px));
      border: 1px solid rgba(15, 118, 110, 0.24);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100vw - 20px, 1280px);
        padding-top: 18px;
      }

      .topbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        justify-content: flex-start;
      }

      .control-button {
        min-height: 40px;
      }

      table {
        min-width: 920px;
      }

      th,
      td {
        padding: 10px 12px;
      }

      col.priority-col {
        width: 76px;
      }

      col.impact-col,
      col.effort-col,
      col.started-col {
        width: 116px;
      }

      col.actions-col {
        width: 96px;
      }

      .dialog-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>AI Ideas</h1>
        <p class="source-note">Rows extracted from AI Ideas.pdf</p>
      </div>
      <div class="controls" aria-label="Table controls">
        <button class="control-button primary" id="addIdea" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
          Add Idea
        </button>
        <button class="control-button" id="toggleArchived" type="button" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 8v13H3V8"></path>
            <path d="M1 3h22v5H1z"></path>
            <path d="M10 12h4"></path>
          </svg>
          <span id="archiveToggleLabel">Show Archived</span>
        </button>
        <button class="control-button" id="downloadCsv" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <path d="M7 10l5 5 5-5"></path>
            <path d="M12 15V3"></path>
          </svg>
          Export CSV
        </button>
      </div>
    </header>

    <p class="status" id="status" aria-live="polite"></p>

    <section class="table-shell" aria-label="AI ideas priority table">
      <table>
        <colgroup>
          <col class="handle-col">
          <col class="priority-col">
          <col class="idea-col">
          <col class="impact-col">
          <col class="effort-col">
          <col class="started-col">
          <col class="actions-col">
        </colgroup>
        <thead>
          <tr>
            <th class="center" scope="col"></th>
            <th class="center" scope="col">Priority</th>
            <th scope="col">IDEA + Description</th>
            <th scope="col">Impact</th>
            <th scope="col">Effort</th>
            <th scope="col">Started</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="ideasBody"></tbody>
      </table>
    </section>

    <dialog id="addIdeaDialog">
      <form class="dialog-form" id="addIdeaForm" method="dialog">
        <div class="dialog-head">
          <h2 class="dialog-title">Add Idea</h2>
          <button class="icon-button" id="closeAddIdea" type="button" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>

        <div class="field-stack">
          <label for="newIdeaText">IDEA + Description</label>
          <textarea class="dialog-textarea" id="newIdeaText" required></textarea>
        </div>

        <div class="dialog-grid">
          <div class="field-stack">
            <label for="newIdeaImpact">Impact</label>
            <select class="dialog-select" id="newIdeaImpact"></select>
          </div>
          <div class="field-stack">
            <label for="newIdeaEffort">Effort</label>
            <select class="dialog-select" id="newIdeaEffort"></select>
          </div>
          <div class="field-stack">
            <label for="newIdeaStarted">Started</label>
            <select class="dialog-select" id="newIdeaStarted"></select>
          </div>
        </div>

        <div class="dialog-actions">
          <button class="control-button" id="cancelAddIdea" type="button">Cancel</button>
          <button class="control-button primary" type="submit">Add Idea</button>
        </div>
      </form>
    </dialog>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script>
    const SUPABASE_CONFIG = window.AI_IDEAS_SUPABASE || {};
    const SHARED_TABLE = "ai_ideas_state";
    const SHARED_RECORD_ID = "shared";
    const STATE_CACHE_KEY = "aiIdeasRows:v3";
    const SHOW_ARCHIVED_KEY = "aiIdeasShowArchived:v1";
    const SYNC_INTERVAL_MS = 15000;
    const fieldOptions = {
      impact: ["", "Testing", "Low", "Medium", "High"],
      effort: ["", "Very low", "Low", "Medium", "High"],
      started: ["", "Yes", "No"]
    };
    const defaultRows = [
      { id: "geo-scorecard", idea: "Zoe’s GEO Scorecard Generator", impact: "Testing", effort: "Very low", started: "Yes" },
      { id: "timeline-release", idea: "Timeline / Release Optimizer", impact: "High", effort: "High", started: "" },
      { id: "weekly-playlist", idea: "Weekly Playlist Tracker for new releases", impact: "High", effort: "Medium", started: "Yes" },
      { id: "cisco-breakpoint", idea: "Cisco’s Breakpoint", impact: "", effort: "", started: "Yes" },
      { id: "cisco-catalogue", idea: "Cisco’s Catalogue Sleeper Hits", impact: "", effort: "", started: "Yes" },
      { id: "billboard-rules", idea: "Billboard Rules chatbot", impact: "", effort: "", started: "" },
      { id: "google-cosign", idea: "Google CoSign", impact: "", effort: "", started: "Yes" },
      { id: "roi-measurement", idea: "Zoe’s ROI Measurement (comparing actual revenues to the forecasted revenue based on machine learning)", impact: "", effort: "High", started: "" },
      { id: "new-release-scorecard", idea: "Zoe’s New Release Scorecard (similarities to Breakpoint)", impact: "", effort: "Medium", started: "Yes" },
      { id: "catalog-track-glenn", idea: "Zoe’s Catalog Track Identifier for Glenn (long term growth)", impact: "", effort: "Low", started: "Yes" },
      { id: "icla-track", idea: "Zoe’s ICLA Track Identifier", impact: "", effort: "Low", started: "Yes" },
      { id: "advertising-intel", idea: "Advertising Intelligence Agent", impact: "", effort: "Medium", started: "" },
      { id: "marketing-intel", idea: "Marketing Intelligence Agent", impact: "", effort: "High", started: "" },
      { id: "marketing-brainstorm", idea: "Marketing Brainstorm Agent", impact: "Low", effort: "Low", started: "" },
      { id: "unsigned-artists", idea: "Unsigned artists score", impact: "", effort: "Medium", started: "" },
      { id: "content-generator", idea: "Content Generator", impact: "", effort: "Low", started: "" },
      { id: "ar-delivery-admin", idea: "A&R music delivery admin", impact: "", effort: "Medium", started: "" },
      { id: "eta-travel", idea: "eTA Artist Travel Agent", impact: "", effort: "High", started: "" },
      { id: "republic-rolodex", idea: "Republic Records A&R creative rolodex", impact: "Low", effort: "Low", started: "" },
      { id: "influencer-matching", idea: "Influencer to Music Matching Score", impact: "", effort: "Medium", started: "" },
      { id: "sync-support", idea: "Sync support agent", impact: "", effort: "Medium", started: "" },
      { id: "international-pulsemap", idea: "International PulseMap", impact: "", effort: "Medium", started: "" }
    ];
    const defaultById = new Map(defaultRows.map((row) => [row.id, row]));

    const tbody = document.querySelector("#ideasBody");
    const status = document.querySelector("#status");
    const toast = document.querySelector("#toast");
    const addIdeaDialog = document.querySelector("#addIdeaDialog");
    const addIdeaForm = document.querySelector("#addIdeaForm");
    const newIdeaText = document.querySelector("#newIdeaText");
    const toggleArchivedButton = document.querySelector("#toggleArchived");
    const archiveToggleLabel = document.querySelector("#archiveToggleLabel");
    let dragRow = null;
    let activePointerId = null;
    let toastTimer = null;
    let remoteSaveTimer = null;
    let syncLabel = "Checking shared database...";
    let lastRemoteUpdatedAt = null;
    let isSavingRemote = false;
    let showArchived = localStorage.getItem(SHOW_ARCHIVED_KEY) === "true";
    let rows = loadCachedRows();

    function updateStatus() {
      const activeCount = rows.filter((row) => !row.archived).length;
      const archivedCount = rows.length - activeCount;
      const archiveText = archivedCount ? `, ${archivedCount} archived` : "";
      status.textContent = `${activeCount} active ideas${archiveText}${syncLabel ? ` • ${syncLabel}` : ""}`;
    }

    function loadCachedRows() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_CACHE_KEY) || "[]");
        return normalizeRows(saved);
      } catch {
        return normalizeRows(defaultRows);
      }
    }

    function saveCachedRows() {
      localStorage.setItem(STATE_CACHE_KEY, JSON.stringify(rowsForSave()));
    }

    function isAllowedValue(field, value) {
      return fieldOptions[field].includes(value) ? value : "";
    }

    function normalizeRows(sourceRows = defaultRows, { includeMissingDefaults = true } = {}) {
      const source = Array.isArray(sourceRows) && sourceRows.length ? sourceRows : defaultRows;
      const seen = new Set();
      const normalized = [];

      source.forEach((row, index) => {
        const fallback = defaultById.get(row?.id) || {};
        const id = typeof row?.id === "string" && row.id.trim() ? row.id.trim() : createId(index);
        if (seen.has(id)) return;
        seen.add(id);

        const idea = String(row?.idea ?? fallback.idea ?? "Untitled idea").trim() || "Untitled idea";
        normalized.push({
          id,
          idea,
          impact: isAllowedValue("impact", row?.impact ?? fallback.impact ?? ""),
          effort: isAllowedValue("effort", row?.effort ?? fallback.effort ?? ""),
          started: isAllowedValue("started", row?.started ?? fallback.started ?? ""),
          archived: row?.archived === true,
          createdAt: row?.createdAt || null,
          updatedAt: row?.updatedAt || null
        });
      });

      if (includeMissingDefaults) {
        defaultRows.forEach((row) => {
          if (!seen.has(row.id)) {
            seen.add(row.id);
            normalized.push({ ...row, archived: false, createdAt: null, updatedAt: null });
          }
        });
      }

      return normalized;
    }

    function rowsForSave() {
      let activePriority = 1;
      return rows.map((row) => ({
        ...row,
        priority: row.archived ? null : activePriority++
      }));
    }

    function visibleRows() {
      return showArchived ? rows : rows.filter((row) => !row.archived);
    }

    function rowById(id) {
      return rows.find((row) => row.id === id);
    }

    function createId(seed = Date.now()) {
      return `idea-${Number(seed).toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function slug(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "-");
    }

    function applySelectTone(select) {
      select.className = `value-select ${slug(select.value) || "empty"}`;
    }

    function editableSelectCell(item, field) {
      const td = document.createElement("td");
      const shell = document.createElement("span");
      shell.className = "select-shell";
      const select = document.createElement("select");
      select.dataset.id = item.id;
      select.dataset.field = field;
      select.setAttribute("aria-label", `${field} for ${item.idea}`);

      fieldOptions[field].forEach((optionValue) => {
        const option = document.createElement("option");
        option.value = optionValue;
        option.textContent = optionValue || "None";
        select.append(option);
      });

      select.value = item[field] || "";
      applySelectTone(select);
      shell.append(select);
      td.append(shell);
      return td;
    }

    function actionCell(item) {
      const td = document.createElement("td");
      const actions = document.createElement("div");
      actions.className = "row-actions";
      const archiveButton = document.createElement("button");
      archiveButton.type = "button";
      archiveButton.className = `icon-button ${item.archived ? "restore" : "archive"}`;
      archiveButton.dataset.id = item.id;
      archiveButton.dataset.action = item.archived ? "restore" : "archive";
      archiveButton.setAttribute("aria-label", `${item.archived ? "Restore" : "Archive"} ${item.idea}`);
      archiveButton.title = item.archived ? "Restore" : "Archive";
      archiveButton.innerHTML = item.archived
        ? `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 3v6h6"></path></svg>`
        : `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8v13H3V8"></path><path d="M1 3h22v5H1z"></path><path d="m9 14 3 3 3-3"></path><path d="M12 11v6"></path></svg>`;
      actions.append(archiveButton);
      td.append(actions);
      return td;
    }

    function ideaCell(item) {
      const td = document.createElement("td");
      const textarea = document.createElement("textarea");
      textarea.className = "idea-input";
      textarea.dataset.id = item.id;
      textarea.value = item.idea;
      textarea.rows = 1;
      textarea.setAttribute("aria-label", `Edit idea ${item.idea}`);
      td.append(textarea);
      requestAnimationFrame(() => autoResizeTextarea(textarea));
      return td;
    }

    function updateRowLabels(row, idea) {
      if (!row) return;
      const dragHandle = row.querySelector(".drag-handle");
      const actionButton = row.querySelector("[data-action]");
      if (dragHandle) {
        dragHandle.setAttribute("aria-label", `Move ${idea}`);
      }
      if (actionButton) {
        const action = actionButton.dataset.action === "restore" ? "Restore" : "Archive";
        actionButton.setAttribute("aria-label", `${action} ${idea}`);
      }
    }

    function renderRows() {
      tbody.replaceChildren();
      const displayRows = visibleRows();

      if (!displayRows.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 7;
        cell.className = "empty-state";
        cell.textContent = showArchived ? "No ideas to show." : "No active ideas. Add one or show archived rows.";
        row.append(cell);
        tbody.append(row);
        updateStatus();
        updateArchiveToggle();
        return;
      }

      displayRows.forEach((item) => {
        const row = document.createElement("tr");
        row.dataset.id = item.id;
        row.classList.toggle("archived-row", item.archived);

        const dragCell = document.createElement("td");
        dragCell.className = "drag-cell center";
        const handle = document.createElement("button");
        handle.type = "button";
        handle.className = "drag-handle";
        handle.setAttribute("aria-label", `Move ${item.idea}`);
        handle.title = "Drag to reorder";
        dragCell.append(handle);

        const priorityCell = document.createElement("td");
        priorityCell.className = "center";
        const priority = document.createElement("span");
        priority.className = "priority";
        priorityCell.append(priority);

        row.append(
          dragCell,
          priorityCell,
          ideaCell(item),
          editableSelectCell(item, "impact"),
          editableSelectCell(item, "effort"),
          editableSelectCell(item, "started"),
          actionCell(item)
        );
        tbody.append(row);
      });
      updatePriorities();
      updateArchiveToggle();
      updateStatus();
    }

    function updatePriorities() {
      let activePriority = 1;
      [...tbody.querySelectorAll("tr[data-id]")].forEach((row) => {
        const item = rowById(row.dataset.id);
        const priority = row.querySelector(".priority");
        if (!priority || !item) return;
        if (item.archived) {
          priority.className = "archived-label";
          priority.textContent = "Archived";
        } else {
          priority.className = "priority";
          priority.textContent = activePriority++;
        }
      });
    }

    function getDragAfterElement(y) {
      const rows = [...tbody.querySelectorAll("tr:not(.dragging)")];
      return rows.reduce((closest, row) => {
        const box = row.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: row };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    function moveDragRow(clientY) {
      if (!dragRow) return;
      const afterElement = getDragAfterElement(clientY);
      tbody.querySelectorAll(".drop-target").forEach((row) => row.classList.remove("drop-target"));
      if (afterElement) {
        afterElement.classList.add("drop-target");
        tbody.insertBefore(dragRow, afterElement);
      } else {
        tbody.append(dragRow);
      }
      updatePriorities();
    }

    function finishDrag() {
      if (!dragRow) return;
      dragRow.classList.remove("dragging");
      tbody.querySelectorAll(".drop-target").forEach((row) => row.classList.remove("drop-target"));
      dragRow = null;
      activePointerId = null;
      syncRowsFromDomOrder();
      showToast("Priority order saved");
    }

    function syncRowsFromDomOrder() {
      const visibleIds = [...tbody.querySelectorAll("tr[data-id]")].map((row) => row.dataset.id);
      if (!visibleIds.length) return;
      const byId = new Map(rows.map((row) => [row.id, row]));
      const orderedVisible = visibleIds.map((id) => byId.get(id)).filter(Boolean);

      if (showArchived) {
        rows = orderedVisible;
      } else {
        const hiddenArchived = rows.filter((row) => row.archived && !visibleIds.includes(row.id));
        rows = [...orderedVisible, ...hiddenArchived];
      }

      saveCachedRows();
      updatePriorities();
      updateStatus();
      queueRemoteSave();
    }

    tbody.addEventListener("pointerdown", (event) => {
      const handle = event.target.closest(".drag-handle");
      if (!handle) return;
      dragRow = handle.closest("tr");
      activePointerId = event.pointerId;
      dragRow.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    tbody.addEventListener("pointermove", (event) => {
      if (!dragRow || event.pointerId !== activePointerId) return;
      event.preventDefault();
      moveDragRow(event.clientY);
    });

    tbody.addEventListener("pointerup", (event) => {
      if (event.pointerId !== activePointerId) return;
      finishDrag();
    });

    tbody.addEventListener("pointercancel", (event) => {
      if (event.pointerId !== activePointerId) return;
      finishDrag();
    });

    tbody.addEventListener("dragstart", (event) => {
      const row = event.target.closest("tr");
      if (!row) return;
      dragRow = row;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", row.dataset.id);
    });

    tbody.addEventListener("dragover", (event) => {
      event.preventDefault();
      if (!dragRow) return;
      moveDragRow(event.clientY);
    });

    tbody.addEventListener("dragend", () => {
      finishDrag();
    });

    tbody.addEventListener("keydown", (event) => {
      if (!event.target.matches(".drag-handle")) return;
      const row = event.target.closest("tr");
      if (event.key === "ArrowUp" && row.previousElementSibling) {
        event.preventDefault();
        tbody.insertBefore(row, row.previousElementSibling);
        syncRowsFromDomOrder();
      }
      if (event.key === "ArrowDown" && row.nextElementSibling) {
        event.preventDefault();
        tbody.insertBefore(row.nextElementSibling, row);
        syncRowsFromDomOrder();
      }
    });

    tbody.addEventListener("change", (event) => {
      if (!event.target.matches(".value-select")) return;
      const { id, field } = event.target.dataset;
      updateRow(id, { [field]: event.target.value });
      applySelectTone(event.target);
      showToast("Selection saved");
      queueRemoteSave();
    });

    tbody.addEventListener("input", (event) => {
      if (!event.target.matches(".idea-input")) return;
      autoResizeTextarea(event.target);
      updateRow(event.target.dataset.id, { idea: event.target.value });
      updateRowLabels(event.target.closest("tr"), event.target.value);
      queueRemoteSave(900);
    });

    tbody.addEventListener("blur", (event) => {
      if (!event.target.matches(".idea-input")) return;
      const value = event.target.value.trim() || "Untitled idea";
      event.target.value = value;
      updateRow(event.target.dataset.id, { idea: value });
      updateRowLabels(event.target.closest("tr"), value);
      autoResizeTextarea(event.target);
      queueRemoteSave();
    }, true);

    tbody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const shouldArchive = button.dataset.action === "archive";
      updateRow(button.dataset.id, { archived: shouldArchive });
      renderRows();
      queueRemoteSave();
      showToast(shouldArchive ? "Idea archived" : "Idea restored");
    });

    function updateRow(id, changes) {
      rows = rows.map((row) => (
        row.id === id
          ? { ...row, ...changes, updatedAt: new Date().toISOString() }
          : row
      ));
      saveCachedRows();
      updateStatus();
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = `${Math.min(textarea.scrollHeight, 130)}px`;
    }

    function csvEscape(value) {
      return `"${String(value ?? "").replaceAll('"', '""')}"`;
    }

    function makeCsv() {
      const headers = ["Priority", "IDEA + Description", "Impact", "Effort", "Started", "Archived"];
      const lines = [headers.map(csvEscape).join(",")];
      rowsForSave().forEach((row) => {
        lines.push([row.priority || "", row.idea, row.impact, row.effort, row.started, row.archived ? "Yes" : "No"].map(csvEscape).join(","));
      });
      return lines.join("\n");
    }

    function downloadCsv() {
      const blob = new Blob([makeCsv()], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "ai-ideas-priority.csv";
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      showToast("CSV exported");
    }

    function applyRemoteState(state) {
      if (!Array.isArray(state.rows)) return;
      rows = normalizeRows(state.rows);
      saveCachedRows();
      renderRows();
    }

    function normalizedSupabaseUrl() {
      const rawUrl = String(SUPABASE_CONFIG.url || "").trim().replace(/\/$/, "");
      if (!rawUrl || rawUrl.includes("YOUR_")) return "";
      if (/^https?:\/\//i.test(rawUrl)) return rawUrl;
      if (/^[a-z0-9-]+$/i.test(rawUrl)) return `https://${rawUrl}.supabase.co`;
      return rawUrl;
    }

    function hasSupabaseConfig() {
      const supabaseUrl = normalizedSupabaseUrl();
      const anonKey = String(SUPABASE_CONFIG.anonKey || "").trim();
      return Boolean(
        supabaseUrl &&
        anonKey &&
        !anonKey.includes("YOUR_")
      );
    }

    function supabaseHeaders(extra = {}) {
      return {
        apikey: SUPABASE_CONFIG.anonKey,
        Authorization: `Bearer ${SUPABASE_CONFIG.anonKey}`,
        ...extra
      };
    }

    function supabaseRestUrl(params = "") {
      return `${normalizedSupabaseUrl()}/rest/v1/${SHARED_TABLE}${params}`;
    }

    async function responseJson(response) {
      const text = await response.text();
      try {
        return text ? JSON.parse(text) : null;
      } catch {
        throw new Error("Expected Supabase JSON but received something else. Check config.js Project URL.");
      }
    }

    async function loadRemoteState({ silent = false } = {}) {
      if (!hasSupabaseConfig()) {
        syncLabel = "Configure Supabase for shared editing; using this browser";
        updateStatus();
        return;
      }

      if (!silent) {
        syncLabel = "Loading shared database...";
        updateStatus();
      }

      try {
        const response = await fetch(
          supabaseRestUrl(`?id=eq.${encodeURIComponent(SHARED_RECORD_ID)}&select=data,updated_at`),
          {
            cache: "no-store",
            headers: supabaseHeaders()
          }
        );
        const records = await responseJson(response);
        if (!response.ok) throw new Error(records.message || "Shared database unavailable");
        if (!records.length) throw new Error("Shared database row is missing");

        const state = {
          ...(records[0].data || {}),
          updatedAt: records[0].updated_at || records[0].data?.updatedAt
        };

        const hasNewRemoteState = state.updatedAt && state.updatedAt !== lastRemoteUpdatedAt;
        if (hasNewRemoteState && !isSavingRemote && !isUserEditing()) {
          applyRemoteState(state);
          if (silent && lastRemoteUpdatedAt) showToast("Shared updates loaded");
        }

        lastRemoteUpdatedAt = state.updatedAt || lastRemoteUpdatedAt;
        syncLabel = "Shared Supabase database connected";
        updateStatus();
      } catch (error) {
        syncLabel = "Shared database offline; using this browser";
        updateStatus();
        if (!silent) showToast(error.message || "Shared database unavailable");
      }
    }

    function isUserEditing() {
      return Boolean(document.activeElement?.matches(".idea-input, .value-select, .dialog-textarea, .dialog-select"));
    }

    function queueRemoteSave(delay = 350) {
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer = setTimeout(saveRemoteState, delay);
    }

    async function saveRemoteState() {
      if (!hasSupabaseConfig()) {
        syncLabel = "Configure Supabase for shared editing; saved in this browser";
        updateStatus();
        return;
      }

      isSavingRemote = true;
      syncLabel = "Saving shared database...";
      updateStatus();

      try {
        const state = {
          version: 1,
          updatedAt: new Date().toISOString(),
          rows: rowsForSave()
        };
        const response = await fetch(
          supabaseRestUrl(`?on_conflict=${encodeURIComponent("id")}`),
          {
          method: "POST",
          headers: supabaseHeaders({
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates,return=representation"
          }),
          body: JSON.stringify([{ id: SHARED_RECORD_ID, data: state }])
          }
        );
        const records = await responseJson(response);
        if (!response.ok) throw new Error(records.message || "Shared save failed");

        lastRemoteUpdatedAt = records[0]?.updated_at || state.updatedAt;
        syncLabel = "Saved to shared Supabase database";
        updateStatus();
      } catch (error) {
        syncLabel = "Shared save failed; local browser copy kept";
        updateStatus();
        showToast(error.message || "Shared save failed");
      } finally {
        isSavingRemote = false;
      }
    }

    function populateSelect(select, options) {
      select.replaceChildren();
      options.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value || "None";
        select.append(option);
      });
    }

    function openAddIdeaDialog() {
      addIdeaForm.reset();
      populateSelect(document.querySelector("#newIdeaImpact"), fieldOptions.impact);
      populateSelect(document.querySelector("#newIdeaEffort"), fieldOptions.effort);
      populateSelect(document.querySelector("#newIdeaStarted"), fieldOptions.started);
      addIdeaDialog.showModal();
      requestAnimationFrame(() => newIdeaText.focus());
    }

    function closeAddIdeaDialog() {
      addIdeaDialog.close();
    }

    function addIdeaFromForm(event) {
      event.preventDefault();
      const idea = newIdeaText.value.trim();
      if (!idea) {
        newIdeaText.focus();
        return;
      }

      const now = new Date().toISOString();
      const newRow = {
        id: createId(Date.now()),
        idea,
        impact: document.querySelector("#newIdeaImpact").value,
        effort: document.querySelector("#newIdeaEffort").value,
        started: document.querySelector("#newIdeaStarted").value,
        archived: false,
        createdAt: now,
        updatedAt: now
      };
      const firstArchivedIndex = rows.findIndex((row) => row.archived);
      if (firstArchivedIndex === -1) {
        rows.push(newRow);
      } else {
        rows.splice(firstArchivedIndex, 0, newRow);
      }
      saveCachedRows();
      renderRows();
      queueRemoteSave();
      closeAddIdeaDialog();
      showToast("Idea added");
    }

    function updateArchiveToggle() {
      toggleArchivedButton.setAttribute("aria-pressed", String(showArchived));
      archiveToggleLabel.textContent = showArchived ? "Hide Archived" : "Show Archived";
    }

    function toggleArchivedRows() {
      showArchived = !showArchived;
      localStorage.setItem(SHOW_ARCHIVED_KEY, String(showArchived));
      renderRows();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    populateSelect(document.querySelector("#newIdeaImpact"), fieldOptions.impact);
    populateSelect(document.querySelector("#newIdeaEffort"), fieldOptions.effort);
    populateSelect(document.querySelector("#newIdeaStarted"), fieldOptions.started);
    document.querySelector("#addIdea").addEventListener("click", openAddIdeaDialog);
    document.querySelector("#closeAddIdea").addEventListener("click", closeAddIdeaDialog);
    document.querySelector("#cancelAddIdea").addEventListener("click", closeAddIdeaDialog);
    addIdeaForm.addEventListener("submit", addIdeaFromForm);
    toggleArchivedButton.addEventListener("click", toggleArchivedRows);
    document.querySelector("#downloadCsv").addEventListener("click", downloadCsv);

    renderRows();
    loadRemoteState();
    setInterval(() => loadRemoteState({ silent: true }), SYNC_INTERVAL_MS);
  </script>
</body>
</html>
